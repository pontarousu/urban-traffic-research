<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Intersection Update Heatmap</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <div class="app">
      <aside class="panel">
        <h1>Intersection Update Heatmap</h1>
        <div class="controls">
          <label><input type="checkbox" id="toggleRoads" checked> 道路</label>
          <label><input type="checkbox" id="toggleHeatmap" checked> 更新ヒートマップ</label>
          <label><input type="checkbox" id="toggleTopLabels"> 上位ラベル</label>
          <label><input type="checkbox" id="toggleOnlyTop"> 上位のみ</label>
          <label>
            指標
            <select id="metricSelect">
              <option value="abs_delta_sum">更新量</option>
              <option value="update_count">更新頻度</option>
              <option value="unique_theta_count">theta数</option>
            </select>
          </label>
        </div>
        <div class="view-actions">
          <button type="button" id="resetView">Reset view</button>
          <span id="zoomReadout">1.00x</span>
        </div>
        <div class="legend">
          <div><span class="chip under"></span>低</div>
          <div><span class="chip boundary-minor"></span>中</div>
          <div><span class="chip boundary-major"></span>高</div>
          <div><span class="chip internal-major"></span>道路</div>
        </div>
        <pre id="summary"></pre>
      </aside>
      <main class="map-wrap">
        <canvas id="mapCanvas"></canvas>
        <div id="tooltip" class="tooltip"></div>
      </main>
    </div>
    <script src="./intersection_update_heatmap.js"></script>
  </body>
</html>
