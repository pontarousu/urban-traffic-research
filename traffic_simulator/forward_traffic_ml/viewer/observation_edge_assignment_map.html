<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Observation Edge Assignment</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <div class="app">
      <aside class="panel">
        <h1>Observation Edge Assignment</h1>
        <div class="controls">
          <label><input type="checkbox" id="toggleRoads" checked> 背景道路</label>
          <label><input type="checkbox" id="toggleMatchedEdges" checked> 対応edge</label>
          <label><input type="checkbox" id="toggleArrows" checked> 矢印</label>
          <label><input type="checkbox" id="toggleConnectors" checked> 観測点→edge</label>
          <label><input type="checkbox" id="togglePoints" checked> 観測点</label>
          <label><input type="checkbox" id="toggleLabels"> ラベル</label>
          <label>
            表示
            <select id="filterSelect">
              <option value="all">全て</option>
              <option value="under">過小のみ</option>
              <option value="over">過大のみ</option>
              <option value="large">大誤差のみ</option>
            </select>
          </label>
        </div>
        <div class="view-actions">
          <button type="button" id="resetView">Reset view</button>
          <span id="zoomReadout">1.00x</span>
        </div>
        <div class="legend">
          <div><span class="chip internal-major"></span>過小観測点</div>
          <div><span class="chip under"></span>過大観測点</div>
          <div><span class="chip boundary-major"></span>対応directed_edge</div>
          <div><span class="chip boundary-minor"></span>観測点→edge</div>
        </div>
        <pre id="summary"></pre>
      </aside>
      <main class="map-wrap">
        <canvas id="mapCanvas"></canvas>
        <div id="tooltip" class="tooltip"></div>
      </main>
    </div>
    <script src="./observation_edge_assignment_map.js"></script>
  </body>
</html>
