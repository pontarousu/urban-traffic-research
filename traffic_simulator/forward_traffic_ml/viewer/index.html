<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forward Traffic ML Diagnostics</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <div class="app">
      <aside class="panel">
        <h1>Forward Traffic ML</h1>
        <div class="controls">
          <label><input type="checkbox" id="toggleRoads" checked> 道路</label>
          <label><input type="checkbox" id="toggleSources" checked> 発生源</label>
          <label><input type="checkbox" id="toggleFlow" checked> 流量</label>
          <label><input type="checkbox" id="toggleObservations" checked> 観測誤差</label>
        </div>
        <div class="legend">
          <div><span class="chip boundary-major"></span>boundary_major</div>
          <div><span class="chip boundary-minor"></span>boundary_minor</div>
          <div><span class="chip internal-major"></span>internal_major</div>
          <div><span class="chip internal-minor"></span>internal_minor</div>
          <div><span class="chip under"></span>過小</div>
          <div><span class="chip over"></span>過大</div>
        </div>
        <pre id="summary"></pre>
      </aside>
      <main class="map-wrap">
        <canvas id="mapCanvas"></canvas>
        <div id="tooltip" class="tooltip"></div>
      </main>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
