<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Observation Boundary Buffer</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <div class="app">
      <aside class="panel">
        <h1>Observation Boundary Buffer</h1>
        <div class="controls">
          <label><input type="checkbox" id="toggleRoads" checked> 背景道路</label>
          <label><input type="checkbox" id="toggleBounds" checked> 地図境界</label>
          <label><input type="checkbox" id="toggleBuffers" checked> 500m/1000m</label>
          <label><input type="checkbox" id="toggleMatchedEdges" checked> 対応edge</label>
          <label><input type="checkbox" id="toggleConnectedEdges" checked> 接続edge</label>
          <label><input type="checkbox" id="toggleHoverEdges" checked> edgeはhover時のみ</label>
          <label><input type="checkbox" id="toggleArrows" checked> 矢印</label>
          <label><input type="checkbox" id="togglePoints" checked> 観測点</label>
          <label><input type="checkbox" id="toggleLabels"> ラベル</label>
          <label>
            表示
            <select id="filterSelect">
              <option value="all">全て</option>
              <option value="lt500">500m未満</option>
              <option value="lt1000">1000m未満</option>
              <option value="eval">評価対象のみ</option>
              <option value="simZero">sim=0のみ</option>
            </select>
          </label>
        </div>
        <div class="controls">
          <label>
            観測点番号
            <input type="text" id="pointSearchInput" placeholder="例: 4183, 536">
          </label>
        </div>
        <div class="view-actions">
          <button type="button" id="showPoint">Show point</button>
          <button type="button" id="clearPoint">Clear point</button>
        </div>
        <div class="view-actions">
          <button type="button" id="resetView">Reset view</button>
          <span id="zoomReadout">1.00x</span>
        </div>
        <div class="legend">
          <div><span class="chip over"></span>500m未満</div>
          <div><span class="chip boundary-major"></span>500-1000m</div>
          <div><span class="chip internal-major"></span>1000m以上</div>
          <div><span class="chip boundary-minor"></span>sim=0</div>
          <div><span class="chip boundary-major"></span>対応edge</div>
          <div><span class="chip internal-minor"></span>接続edge</div>
        </div>
        <pre id="summary"></pre>
      </aside>
      <main class="map-wrap">
        <canvas id="mapCanvas"></canvas>
        <div id="tooltip" class="tooltip"></div>
      </main>
    </div>
    <script src="./observation_boundary_buffer_map.js"></script>
  </body>
</html>
